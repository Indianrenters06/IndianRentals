services:
  - type: web
    name: indian-rentals-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        sync: false
      - key: CASHFREE_API_VERSION
        value: "2023-08-01"
      # Deployed frontend URLs for CORS — update after Netlify deploy
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      # Google OAuth client ID
      - key: GOOGLE_CLIENT_ID
        sync: false
