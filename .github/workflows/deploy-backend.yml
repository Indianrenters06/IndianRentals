name: Deploy backend (Hostinger VPS)

# Auto-deploys the Express API to the Hostinger VPS on every push to main
# that touches backend/. Can also be run manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

# Avoid overlapping deploys if you push twice quickly.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VPS, pull & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 31.97.202.194
          username: root
          key: ${{ secrets.VPSSSHKEY }}
          script_stop: true
          script: |
            set -e
            cd /var/www/IndianRentals
            git pull --ff-only
            cd backend
            npm ci --omit=dev
            pm2 restart indianrentals-api --update-env
            pm2 save --force
            echo "Deployed $(git rev-parse --short HEAD) at $(date -u)"
